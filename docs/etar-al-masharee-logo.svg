<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Etar Al Masharee logo mark</title>
  <desc id="desc">A premium emerald and gold architectural logo mark inspired by the Etar Al Masharee identity.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F5D98F"/>
      <stop offset="0.48" stop-color="#C9A15A"/>
      <stop offset="1" stop-color="#8B6524"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0F4B3B"/>
      <stop offset="1" stop-color="#06271F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0D3B2E" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="900" height="900" fill="none"/>
  <g filter="url(#shadow)">
