<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ETAR AL MASHAREE brand board</title>
  <desc id="desc">A visual brand board for Etar Al Masharee showing the premium cream background, emerald green, metallic gold, charcoal, typography samples, and visual motifs inspired by an architectural arch.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F1D38A"/>
      <stop offset="0.45" stop-color="#C9A15A"/>
      <stop offset="1" stop-color="#8C6726"/>
    </linearGradient>
    <pattern id="arches" width="110" height="110" patternUnits="userSpaceOnUse">
      <path d="M30 92 V46 A25 25 0 0 1 80 46 V92" fill="none" stroke="#0D3B2E" stroke-width="3" opacity="0.08"/>
      <path d="M45 92 V52 A10 10 0 0 1 65 52 V92" fill="none" stroke="#C9A15A" stroke-width="2" opacity="0.12"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1A2922" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#FAF9F6"/>
  <rect width="1600" height="1000" fill="url(#arches)"/>

  <rect x="80" y="70" width="1440" height="860" rx="42" fill="#fffdf8" filter="url(#softShadow)"/>
  <rect x="110" y="100" width="1380" height="800" rx="30" fill="#FAF9F6"/>

  <g transform="translate(170 145)">
    <text x="0" y="0" fill="#C9A15A" font-family="Cinzel, Optima, Georgia, serif" font-size="22" letter-spacing="6">VISUAL IDENTITY</text>
    <text x="0" y="80" fill="#0D3B2E" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700">ETAR AL MASHAREE</text>
    <text x="0" y="135" fill="#1A2922" font-family="Arial, sans-serif" font-size="34">Premium real estate and finance solutions</text>
    <line x1="0" y1="174" x2="520" y2="174" stroke="#C9A15A" stroke-width="4"/>
    <rect x="548" y="164" width="20" height="20" transform="rotate(45 558 174)" fill="#C9A15A"/>
    <line x1="596" y1="174" x2="1110" y2="174" stroke="#C9A15A" stroke-width="4"/>
  </g>

  <g transform="translate(190 390)">
    <rect x="0" y="0" width="360" height="360" rx="28" fill="#0D3B2E"/>
    <path d="M98 274 V122 A82 82 0 0 1 262 122 V274" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
    <path d="M142 270 V150 L175 118 V270" fill="#FAF9F6"/>
    <path d="M210 270 V105 L243 73 V270" fill="#FAF9F6"/>
    <text x="180" y="323" text-anchor="middle" fill="#C9A15A" font-family="Arial, sans-serif" font-size="34" direction="rtl">&#1573;&#1591;&#1575;&#1585; &#1575;&#1604;&#1605;&#1588;&#1575;&#1585;&#1610;&#1593;</text>
  </g>

  <g transform="translate(620 383)">
    <text x="0" y="0" fill="#1A2922" font-family="Arial, sans-serif" font-size="28" font-weight="700">Color system</text>
    <g transform="translate(0 42)">
      <rect x="0" y="0" width="185" height="150" rx="18" fill="#0D3B2E"/>
      <text x="22" y="104" fill="#FAF9F6" font-family="Arial, sans-serif" font-size="20">Emerald</text>
      <text x="22" y="132" fill="#FAF9F6" font-family="Arial, sans-serif" font-size="18">#0D3B2E</text>
    </g>
    <g transform="translate(215 42)">
      <rect x="0" y="0" width="185" height="150" rx="18" fill="#C9A15A"/>
      <text x="22" y="104" fill="#1A2922" font-family="Arial, sans-serif" font-size="20">Metallic gold</text>
      <text x="22" y="132" fill="#1A2922" font-family="Arial, sans-serif" font-size="18">#C9A15A</text>
    </g>
    <g transform="translate(430 42)">
      <rect x="0" y="0" width="185" height="150" rx="18" fill="#1A2922"/>
      <text x="22" y="104" fill="#FAF9F6" font-family="Arial, sans-serif" font-size="20">Charcoal</text>
      <text x="22" y="132" fill="#FAF9F6" font-family="Arial, sans-serif" font-size="18">#1A2922</text>
    </g>
    <g transform="translate(645 42)">
      <rect x="0" y="0" width="185" height="150" rx="18" fill="#FAF9F6" stroke="#C9A15A" stroke-width="3"/>
      <text x="22" y="104" fill="#1A2922" font-family="Arial, sans-serif" font-size="20">Premium cream</text>
      <text x="22" y="132" fill="#1A2922" font-family="Arial, sans-serif" font-size="18">#FAF9F6</text>
    </g>
  </g>

  <g transform="translate(620 640)">
    <text x="0" y="0" fill="#1A2922" font-family="Arial, sans-serif" font-size="28" font-weight="700">Typography</text>
    <text x="0" y="70" fill="#0D3B2E" font-family="Arial, sans-serif" font-size="46" font-weight="700" direction="rtl">A clear frame for secure investment</text>
    <text x="0" y="128" fill="#1A2922" font-family="Cinzel, Optima, Georgia, serif" font-size="38" letter-spacing="3">ARCHITECTURAL TRUST</text>
    <text x="0" y="184" fill="#1A2922" font-family="Arial, sans-serif" font-size="24">Calm layouts, generous spacing, precise gold accents, and a deep emerald foundation.</text>
  </g>

  <g transform="translate(170 805)">
    <text x="0" y="0" fill="#C9A15A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Visual system</text>
    <text x="0" y="44" fill="#1A2922" font-family="Arial, sans-serif" font-size="24">Architectural arches, precise gold lines, premium cream space, and a confident institutional tone.</text>
  </g>
</svg>
